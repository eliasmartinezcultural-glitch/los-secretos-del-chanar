<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>Los Secretos del Chañar</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<!-- ================================
     PANTALLA DE INICIO
================================ -->

<div id="start-screen">

    <div class="start-box">

        <div class="game-logo">
            LOS SECRETOS
            <span>DEL CHAÑAR</span>
        </div>

        <p class="subtitle">
            Un pueblo guarda más historias
            de las que aparenta.
        </p>

        <button id="start-button">
            COMENZAR
        </button>

        <p class="creator">
            Juego creado por
            <strong>Elías Martínez</strong>
        </p>

    </div>

</div>


<!-- ================================
     JUEGO
================================ -->

<canvas id="game"></canvas>


<!-- ================================
     HUD
================================ -->

<div id="hud">

    <div class="hud-top">

        <div class="location-box">

            <span id="location-name">
                San Patricio del Chañar
            </span>

            <small id="clock">
                08:00
            </small>

        </div>


        <div class="mission-box">

            <span id="mission-hud">
                Explorá el pueblo
            </span>

        </div>

    </div>


    <div id="interaction-hint">
        Acercate a una persona o lugar
    </div>


    <div id="status-message"></div>

</div>


<!-- ================================
     MINIMAPA
================================ -->

<div id="map-container">

    <canvas
        id="minimap"
        width="190"
        height="130"
    ></canvas>

    <span>MAPA</span>

</div>


<!-- ================================
     CONTROLES CELULAR
================================ -->

<div id="mobile-controls">

    <div
        id="joystick-area"
        class="joystick-area"
    >

        <div
            id="joystick"
            class="joystick"
        ></div>

    </div>


    <div class="mobile-actions">

        <button
            id="mobile-interact"
            class="action-button"
        >
            E
        </button>

        <button
            id="mobile-inventory"
            class="action-button"
        >
            M
        </button>

    </div>

</div>


<!-- ================================
     DIÁLOGO
================================ -->

<div
    id="dialogue"
    class="panel hidden"
>

    <div class="dialogue-avatar"></div>

    <div class="dialogue-content">

        <div
            id="dialogue-name"
            class="dialogue-name"
        ></div>

        <div
            id="dialogue-text"
            class="dialogue-text"
        ></div>

        <button
            id="dialogue-close"
        >
            Cerrar
        </button>

    </div>

</div>


<!-- ================================
     GLOBO DE DIÁLOGO
================================ -->

<div
    id="speech-bubble"
    class="speech-bubble hidden"
></div>


<!-- ================================
     MISIÓN
================================ -->

<div
    id="mission-panel"
    class="panel hidden"
>

    <h2 id="mission-title"></h2>

    <p id="mission-description"></p>

    <button id="mission-close">
        Continuar
    </button>

</div>


<!-- ================================
     INVENTARIO
================================ -->

<div
    id="inventory-panel"
    class="panel inventory hidden"
>

    <h2>
        Mochila
    </h2>

    <div
        id="inventory-items"
    >
        Inventario vacío.
    </div>

    <button id="inventory-close">
        Cerrar
    </button>

</div>


<!-- ================================
     INTERIOR
================================ -->

<div
    id="interior-panel"
    class="hidden"
>

    <div class="interior-header">

        <span id="interior-title">
            Interior
        </span>

        <button id="exit-building">
            SALIR
        </button>

    </div>

    <div id="interior-content"></div>

</div>


<!-- ================================
     NOTIFICACIÓN
================================ -->

<div
    id="toast"
    class="toast hidden"
></div>


<script src="game.js"></script>

</body>
</html>
